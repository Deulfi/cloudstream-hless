name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  engine:
    name: Engine — ABI, tests + fat jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6 (pinned third-party action)
      - name: Library ABI matches api/library.api
        run: ./gradlew :library:checkKotlinAbi --console=plain
      - name: Run engine tests
        run: ./gradlew :engine:test --console=plain
      - name: Build fat jar and SBOM
        run: ./gradlew :engine:jar :engine:sbom --console=plain
      # Reported, not gating: this fork does not triage advisories or licences.
      - name: Advisories for the packed dependency versions
        continue-on-error: true
        run: |
          python3 scripts/dependency_report.py advisories engine/build/sbom/daemon.cdx.json \
            --triage engine/advisory-triage.json --output engine/build/sbom/advisories.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-jar
          path: |
            engine/build/libs/daemon.jar
            engine/build/sbom/
