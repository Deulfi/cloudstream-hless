name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  engine:
    name: Engine — ABI, tests + fat jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6 (pinned third-party action)
      - name: Library ABI matches api/library.api
        run: ./gradlew :library:checkKotlinAbi --console=plain
      - name: Run engine tests
        run: ./gradlew :engine:test --console=plain
      - name: Build fat jar and SBOM
        run: ./gradlew :engine:jar :engine:sbom --console=plain
      # Reported, not gating: this fork does not triage advisories or licences.
      - name: Advisories for the packed dependency versions
        continue-on-error: true
        run: |
          python3 scripts/dependency_report.py advisories engine/build/sbom/daemon.cdx.json \
            --triage engine/advisory-triage.json --output engine/build/sbom/advisories.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-jar
          path: |
            engine/build/libs/daemon.jar
            engine/build/sbom/

  # Independent of the test job: a failing upstream test must not block the image.
  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6 (pinned third-party action)
      - name: Build fat jar
        run: ./gradlew :engine:jar --console=plain
      - name: Build image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          docker build -t hless:ci .
      - name: Runtime has the modules the engine needs
        run: docker run --rm --entrypoint java hless:ci --list-modules | grep '^jdk.incubator.foreign' # no -q: an early exit breaks the pipe under pipefail
      # The engine alone: proves the image starts.
      - name: Engine starts inside the image
        run: |
          docker run -d --name smoke --network host hless:ci com.lagradost.macos.MainKt 17171 ci-smoke-token-0123456789
          for i in $(seq 1 60); do
            health="$(curl -fsS -m 2 http://127.0.0.1:17171/health || true)"
            if [[ "$health" == *'"phase":"ready"'* ]]; then echo "engine ready"; exit 0; fi
            sleep 1
          done
          docker logs smoke; exit 1
      - name: Push to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag hless:ci "$IMAGE:latest"
          docker tag hless:ci "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::12}"
